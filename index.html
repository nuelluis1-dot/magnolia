<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnolia</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#050505;
color:white;
overflow:hidden;
}

.screen{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.logo{
width:300px;
max-width:85%;
filter:drop-shadow(0 0 25px #00aaff);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

h1{
margin-top:20px;
font-size:45px;
color:#00aaff;
text-shadow:0 0 20px #00aaff;
}

.btn{
margin-top:30px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:999px;
cursor:pointer;
background:#00aaff;
color:white;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00aaff;
}

.hidden{
display:none;
}

.bg{
position:fixed;
inset:0;
background:radial-gradient(circle at center,
rgba(0,140,255,.15),
transparent 70%);
z-index:-1;
}
</style>
</head>

<body>

<div class="bg"></div>

<div id="welcome" class="screen">
<img src="logo.png" class="logo">
<h1>SELAMAT DATANG</h1>
<button class="btn" onclick="nextPage()">
Klik Untuk Melanjutkan
</button>
</div>

<div id="main" class="screen hidden">
<img src="logo.png" class="logo">
<h1>MAGNOLIA</h1>

<button class="btn"
onclick="window.location.href='https://chat.whatsapp.com/EkhgXtViRlM3WydimjLVOb'">
JOIN WHATSAPP
</button>
</div>

<script>
function nextPage(){
document.getElementById("welcome").classList.add("hidden");
document.getElementById("main").classList.remove("hidden");
}
</script>

</body>
</html>
